# ansible/roles/jenkins/tasks/main.yml

- name: Install required packages
  dnf:
    name:
      - java-17-openjdk
      - wget
    state: present

- name: Add Jenkins repository
  get_url:
    url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo

- name: Import Jenkins repo key
  rpm_key:
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io.key
    state: present

- name: Install Jenkins
  dnf:
    name: jenkins
    state: present

- name: Enable & Start Jenkins
  service:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to create initial password
  wait_for:
    path: /var/lib/jenkins/secrets/initialAdminPassword
    timeout: 60

- name: Read initial Jenkins admin password
  slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_pass

- name: Show Jenkins initial admin password
  debug:
    msg: "🔥 Jenkins 초기 암호: {{ jenkins_pass.content | b64decode }}"

