---
##############################################################
# 0) 서버 초기 정리: 기본 server.cnf & master_status.json 삭제
##############################################################
- name: Remove default server.cnf to avoid conflict
  file:
    path: /etc/my.cnf.d/server.cnf
    state: absent
  notify: restart mariadb

- name: Remove old master status file on slave
  file:
    path: /tmp/master_status.json
    state: absent

##############################################################
# 1) root 패스워드 설정
##############################################################
- name: Set root password (initial)
  mysql_user:
    login_user: root
    login_password: ""
    login_unix_socket: /var/lib/mysql/mysql.sock
    user: root
    password: "{{ mysql_root_password }}"
    host_all: yes
  ignore_errors: yes

##############################################################
# 2) /root/.my.cnf 생성
##############################################################
- name: Create /root/.my.cnf
  copy:
    dest: /root/.my.cnf
    content: |
      [client]
      user=root
      password={{ mysql_root_password }}
      socket=/var/lib/mysql/mysql.sock
      default-character-set=utf8mb4
    mode: "0600"
  become: true

##############################################################
# 3) 슬레이브 my.cnf 배포
##############################################################
- name: Apply slave config
  template:
    src: my.cnf.j2
    dest: "{{ config_file }}"
  notify: restart mariadb

##############################################################
# 4) SLAVE 초기화 (Stop + Reset)
##############################################################
- name: Stop slave before configuring
  mysql_replication:
    mode: stopreplica
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/lib/mysql/mysql.sock
  ignore_errors: yes

- name: Reset slave before configuring
  mysql_replication:
    mode: resetreplica
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/lib/mysql/mysql.sock
  ignore_errors: yes

