##############################################################
# 7) CHANGE MASTER TO
##############################################################
- name: Configure slave replication
  mysql_replication:
    mode: changeprimary
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/lib/mysql/mysql.sock
    master_host: "{{ master_host }}"
    master_user: "{{ replication_user }}"
    master_password: "{{ replication_password }}"
    master_log_file: "{{ hostvars[groups['db-master'][0]]['replication_master_log_file'] }}"
    master_log_pos: "{{ hostvars[groups['db-master'][0]]['replication_master_log_pos'] }}"
      #master_log_file: "{{ hostvars['db-m'].replication_master_log_file }}"
      #master_log_pos: "{{ hostvars['db-m'].replication_master_log_pos }}"
      #    master_log_file: "{{ master_log_file }}"
      #    master_log_pos: "{{ master_log_pos }}"

##############################################################
# 8) START SLAVE
##############################################################
- name: Start slave replication
  mysql_replication:
    mode: startreplica
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/lib/mysql/mysql.sock

