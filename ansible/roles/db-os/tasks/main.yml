---
# -----------------------------
# Step 1: Podman Clean-Up
# -----------------------------
- name: 🐋 Stop podman service if present
  systemd:
    name: podman
    state: stopped
  ignore_errors: yes

- name: 🗑️ Remove Podman related packages
  dnf:
    name:
      - podman
      - buildah
      - containers-common
    state: absent
  ignore_errors: yes

# -----------------------------
# Step 2: Install Docker (Official CE Repo)
# -----------------------------
- name: 📦 Install docker dependencies
  dnf:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present

- name: 📥 Add Docker CE repo
  command: >
    dnf config-manager --add-repo
    https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

- name: 💿 Install Docker CE packages
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: ▶️ Enable and start docker service
  systemd:
    name: docker
    enabled: yes
    state: started

# -----------------------------
# Step 3: MinIO Container Setup (Uses variables from defaults/main.yml)
# -----------------------------
- name: 📂 Create MinIO data directory
  file:
    path: "{{ minio_dir }}"
    state: directory
    mode: "0755"

- name: 🚀 Run MinIO container
  community.docker.docker_container:
    name: minio
    image: minio/minio
    state: started
    restart_policy: always
    published_ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "{{ minio_dir }}:/data"
    env:
      MINIO_ROOT_USER: "{{ minio_user }}"
      MINIO_ROOT_PASSWORD: "{{ minio_password }}"
    command: server /data --console-address ":9001"

# -----------------------------
# Step 4: Firewall Configuration
# -----------------------------
- name: 🛡️ Allow MinIO ports
  firewalld:
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - 9000/tcp
    - 9001/tcp
